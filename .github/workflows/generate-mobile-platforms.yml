name: Generate mobile platform projects

on:
  push:
    branches:
      - feature/mobile-platform-foundation
    paths-ignore:
      - android/**
      - ios/**

permissions:
  contents: write

jobs:
  generate:
    name: Generate Android and iOS projects
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Generate mobile platform projects
        run: flutter create --org nl.verstobbertje --project-name verstobbertje --platforms=android,ios .

      - name: Commit generated platform projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios
          if git diff --cached --quiet; then
            echo "Mobile platform projects are already present."
            exit 0
          fi
          git commit -m "Add generated Android and iOS platform projects"
          git push
