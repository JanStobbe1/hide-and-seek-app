name: Flutter CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format .
      - name: Capture formatter diff
        run: git diff > format.diff
      - uses: actions/upload-artifact@v4
        with:
          name: formatter-diff
          path: format.diff
