name: Fix PR 7 analyzer issues

on:
  push:
    branches:
      - codex/voer-opdracht-uit-volgens-documentatie

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/voer-opdracht-uit-volgens-documentatie
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply analyzer-safe fixes
        run: dart fix --apply
      - name: Format
        run: dart format .
      - name: Verify analyzer
        run: flutter analyze
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No analyzer fixes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix Flutter analyzer issues"
          git push
