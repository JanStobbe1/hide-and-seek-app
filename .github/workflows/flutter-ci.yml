name: Flutter CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    name: Validate Flutter app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply formatting
        run: |
          dart format lib/presentation/games_screens.dart lib/presentation/profile_screen.dart lib/presentation/create_game_screen.dart test/completed_games_screen_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/games_screens.dart lib/presentation/profile_screen.dart lib/presentation/create_game_screen.dart test/completed_games_screen_test.dart
          git commit -m "Pas dart format toe"
          git push
