name: Flutter CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate Flutter app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Return formatted sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dart format lib/presentation/games_screens.dart lib/presentation/profile_screen.dart lib/presentation/create_game_screen.dart test/completed_games_screen_test.dart
          {
            for file in lib/presentation/games_screens.dart lib/presentation/profile_screen.dart lib/presentation/create_game_screen.dart test/completed_games_screen_test.dart; do
              echo "FILE:$file"
              base64 -w0 "$file"
              echo
            done
          } > formatted.txt
          gh pr comment "${{ github.event.pull_request.number }}" --body-file formatted.txt
