name: Flutter CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate Flutter app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format branch
        run: dart format .

      - name: Publish formatted sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo FORMATTED_ACTIVE_GAME
            base64 -w0 lib/presentation/active_game_screen.dart
            echo
            echo FORMATTED_POWERS
            base64 -w0 lib/domain/stobbe_powers.dart
            echo
            echo FORMATTED_TEST
            base64 -w0 test/stobbe_powers_test.dart
          } > /tmp/formatted.txt
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/formatted.txt

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web
