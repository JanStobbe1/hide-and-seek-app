name: Exact Dart format
on:
  push:
    branches: [codex/voer-opdracht-uit-volgens-documentatie]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/voer-opdracht-uit-volgens-documentatie
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
      - run: dart format .
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format entire Flutter project"
          git push origin HEAD:codex/voer-opdracht-uit-volgens-documentatie
