name: Flutter CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Flutter app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format source
        run: dart format .

      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: formatted-source
          path: |
            lib/presentation/active_game_screen.dart
            lib/presentation/onboarding_screen.dart
            test/active_game_screen_test.dart
            test/stobbe_powers_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web
