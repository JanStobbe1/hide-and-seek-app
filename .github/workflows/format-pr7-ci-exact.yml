name: Format PR 7 with CI Flutter

on:
  push:
    branches:
      - codex/voer-opdracht-uit-volgens-documentatie

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/voer-opdracht-uit-volgens-documentatie
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install dependencies exactly like CI
        run: flutter pub get
      - name: Format exactly like CI
        run: dart format .
      - name: Commit exact CI formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Apply Flutter 3.47.4 CI formatting"
          git push
