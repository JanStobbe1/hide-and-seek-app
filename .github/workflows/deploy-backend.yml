name: Deploy backend API

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate D1 and deploy API
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend tooling
        working-directory: backend
        run: npm install

      - name: Create production Wrangler config
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          LIVE_APP_ORIGIN: ${{ secrets.LIVE_APP_ORIGIN }}
        run: |
          test -n "$D1_DATABASE_ID"
          test -n "$LIVE_APP_ORIGIN"
          sed             -e "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/"             -e "s#https://REPLACE_WITH_LIVE_APP_DOMAIN#$LIVE_APP_ORIGIN#"             backend/wrangler.example.jsonc > backend/wrangler.production.jsonc

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --prefix backend wrangler d1 migrations apply verstobbertje --config backend/wrangler.production.jsonc --remote

      - name: Deploy backend Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --prefix backend wrangler deploy --config backend/wrangler.production.jsonc

      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          PLAYER_TOKEN_SECRET: ${{ secrets.PLAYER_TOKEN_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          test -n "$ADMIN_API_TOKEN"
          test -n "$PLAYER_TOKEN_SECRET"
          printf '%s' "$ADMIN_API_TOKEN" | npx --prefix backend wrangler secret put ADMIN_API_TOKEN --config backend/wrangler.production.jsonc
          printf '%s' "$PLAYER_TOKEN_SECRET" | npx --prefix backend wrangler secret put PLAYER_TOKEN_SECRET --config backend/wrangler.production.jsonc
          if [ -n "$VAPID_PRIVATE_KEY" ]; then
            printf '%s' "$VAPID_PRIVATE_KEY" | npx --prefix backend wrangler secret put VAPID_PRIVATE_KEY --config backend/wrangler.production.jsonc
          else
            echo "::warning::Nearby push notifications remain disabled until VAPID_PRIVATE_KEY is configured."
          fi
